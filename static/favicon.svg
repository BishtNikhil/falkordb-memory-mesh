<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#06080C" />
    </linearGradient>
    <linearGradient id="cyanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FFD700" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.8" />

  <!-- Graph Links -->
  <line x1="32" y1="16" x2="16" y2="44" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.6" />
  <line x1="32" y1="16" x2="48" y2="44" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.6" />
  <line x1="16" y1="44" x2="48" y2="44" stroke="#10B981" stroke-width="2.5" stroke-opacity="0.6" stroke-dasharray="3,2" />

  <!-- Central Trident Crown (Trishula) -->
  <path d="M 32 10 L 32 38 M 24 20 C 24 28, 32 32, 32 38 C 32 32, 40 28, 40 20 M 24 20 L 22 17 M 40 20 L 42 17" 
        stroke="#FFD700" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />

  <!-- Graph Nodes -->
  <!-- Apex Commander Node (Gold) -->
  <circle cx="32" cy="16" r="5" fill="#FFD700" stroke="#06080C" stroke-width="1.5" filter="url(#glow)" />
  <!-- Sovereign Agent Node (Cyan) -->
  <circle cx="16" cy="44" r="4.5" fill="#00F0FF" stroke="#06080C" stroke-width="1.5" />
  <!-- Rule Substrate Node (Emerald Green) -->
  <circle cx="48" cy="44" r="4.5" fill="#10B981" stroke="#06080C" stroke-width="1.5" />
</svg>
