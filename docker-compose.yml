version: '3.8'

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: falkordb_engine
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  memory_mesh_app:
    build: .
    container_name: falkordb_memory_mesh
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  falkordb_data:
